    owns_paths: [dashboard/lib/fleet.ts]
    acceptance: ["46 agents", "7 real departments", "id/name/role/dept/color per agent from Teams/"]
  - id: WI-2
    owner: dev
    objective: "Point lib/agents.ts + AgentDepartment type at the real fleet (keep interface the screens use)"
    produces: [dashboard/lib/agents.ts, dashboard/lib/types.ts]
    blocked_by: [WI-1]
    acceptance: ["/agents + /org-chart render the 46 real agents by real department", "tsc clean on touched files"]
  - id: WI-3
    owner: atlas
    objective: "Add AgentX (+ others) to workspaces; nav regroup around brands + departments"
    produces: [dashboard/lib/workspaces.ts, dashboard/components/Sidebar.tsx]
