  proof: >
    lib/fleet.ts generated from Teams/ = 46 real agents across 7 real departments (Engineering shows all 11).
    /api/org-chart rebuilt to serve the real fleet tree (leaders report to operator). AgentX added to
    workspaces + globals accent theme. 3 touched files syntax-clean. Identity layer aligned.
  lesson: "Fleet data now flows from Teams/ (single source of truth) into the dashboard via lib/fleet.ts — regenerate on Teams/ change. Next phases: nav regroup around brands+depts, backend rewire (ToonGine→rag/), per-screen live data."
