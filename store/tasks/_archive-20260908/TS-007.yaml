id: TS-007
status: done
source_message: "why the loop workflow didn't work which mentioned in workflow.md — I have to tell manually it didn't work instead of auto verified"
requester: operator
rules: { sharding: worker gets item + contracts, handoff: contracts-only, inject_form: .toon }

classification:
  task_type: external_verification_loop
  departments: [Engineering, Cybersecurity]
  lead: dev
  owner_watch: quinn
  security_review: warden   # Vercel CLI auth token lives in ~/.local/share/com.vercel.cli

discovery:
  decisions:
    - trigger: "post-push script polls Vercel CLI (no webhook infra)"
    - autofix_scope: "known classes only — match log against gate patterns; unknown → escalate with diagnosis"
    - rail_gap: >
        MASTER §7.1 (test-fail → auto-loop N=3) and §7.3 (dissatisfaction loop, 2 auto-revisions
        before escalate) are defined for INTERNAL verification signals (Playwright, tsc, unit tests).
        Vercel is external — its build result lived only in the operator's browser tab. There was
        no wiring anywhere in the repo that (a) watched the deployment, (b) captured the log on
        failure, (c) fed it into the §7.1 auto-loop. So every fail routed through operator eyes.
        TS-006 shifted verification LEFT (pre-push gate). TS-007 closes the RIGHT side (post-push
        loop) so external verification signals become internal ones.

work_items:
  - id: WI-1
    owner: quinn
    objective: "cli/vercel-classify.sh — read log from stdin, match error against known bug classes, print exact fix + regression note"
    produces: [cli/vercel-classify.sh]
    owns_paths: [cli/vercel-classify.sh]
    acceptance:
      - "each of the 5 real deploy-failure logs (deploys #1-#5) classifies correctly"
      - "known classes: undeclared_imports, bare_supabase, promise_all_arity, tsc name_error, tsc missing_module, vercel_crons, dup_config"
      - "unknown class → 'add to gate' message per §7.4 (caught once, coded forever)"
      - "matches both raw tsc output ('error TS2304:') and Next 15 output ('Type error:')"

  - id: WI-2
    owner: dev
    objective: "cli/vercel-watch.sh — poll Vercel CLI for HEAD commit deployment; on fail pipe log to classifier"
    produces: [cli/vercel-watch.sh]
    owns_paths: [cli/vercel-watch.sh]
    blocked_by: [WI-1]
    acceptance:
      - "auto-detects deployment for current git HEAD (via short-sha match in `vercel ls`)"
      - "polls state every 15s (configurable), timeout 10min (configurable)"
      - "on ERROR/CANCELED: prints log tail + classifier output; exits 1"
      - "on READY: prints URL; exits 0"
      - "no vercel CLI installed → prints setup instructions, exits 2 (non-fatal to deploy.sh)"

  - id: WI-3
    owner: dev
    objective: "cli/deploy.sh — end-to-end loop: gate → push → watch"
    produces: [cli/deploy.sh]
    owns_paths: [cli/deploy.sh]
    blocked_by: [WI-1, WI-2]
    acceptance:
      - "cli/deploy.sh runs pre-push gate; blocks push on any finding"
      - "on gate PASS: git push origin <branch>"
      - "post-push: invokes vercel-watch.sh (skippable with --skip-watch)"
      - "--no-verify bypasses gate (documented but not recommended)"

  - id: WI-4
    owner: meta
    objective: "TS-007 spec + Hermes lesson"
    produces: [store/tasks/TS-007.yaml, store/hermes/MEMORY.md]
    blocked_by: [WI-3]
    acceptance:
      - "TS-007.yaml exists with feedback.outcome=done"
      - "Fleet lesson pushed: 'external verification signals must be internalized — see cli/deploy.sh'"

dag: { critical_path: [WI-1, WI-2, WI-3, WI-4] }
exit_gate:
  owner: quinn
  proof: "cli/vercel-classify.sh: 7 known classes; regression test replayed all 5 real Vercel failure logs (deploys #1-#5) — 4 classified first pass, 1 after Next-15-format pattern; cli/vercel-watch.sh polls via vercel CLI; cli/deploy.sh wires gate → push → watch"

approved_by: operator   # E2 backfill 2026-08-24 — pre-history record, operator-directed; approved_at not recorded
feedback:
  outcome: done
  proof: >
    cli/vercel-classify.sh — 7 known classes (undeclared_imports, bare_supabase,
    promise_all_arity, tsc name_error, tsc missing_module, vercel_crons, dup_config).
    Regression test: replayed all 5 real Vercel failure logs (deploys #1-#5) → 4
    classified correctly on first pass (undeclared, bare_supabase, promise_arity,
    name_error), 1 needed a Next-15-format pattern (Type error: vs error TSxxxx:) —
    fixed. Now matches both formats.
    cli/vercel-watch.sh polls via `vercel` CLI; auto-detects commit via short-sha
    match in `vercel ls`. cli/deploy.sh wires: gate → push → watch, one command.
  lesson: "The MASTER §7.1/§7.3 loops are defined for signals INSIDE the agent
    process. Signals from external systems (Vercel builds, Supabase migrations,
    third-party APIs) must be actively wired IN — otherwise they route through
    operator eyes and the loop cannot fire. TS-006 shifted verification LEFT
    (pre-push gate); TS-007 wires the RIGHT side (post-push watch + classify).
    Rule: every external system whose failure the operator has to relay manually
    is a rail gap — build the wiring."
