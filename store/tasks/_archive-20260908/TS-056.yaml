        status: pending
        evidence: ""
      - text: "Layout grammar fidelity: Tight spacing, hard edges with minimal radii, hairline rules, and full-bleed editorial blocks per the measured system. (falsifier: Soft rounded cards, wide-gutter SaaS layout, or prominent drop-shadow card aesthetics appear anywhere on the page.)"
        status: pending
        evidence: ""
      - text: "Motion fidelity (PURE CODE): Entrance and scroll motion reproduces the reference's feel with code only — typography-led line reveals, directional vertical/horizontal movement, no elastic/bounce easing, all motion finite. (falsifier: Decorative bounce/elastic motion appears, or primary content has no entrance/scroll motion at all.)"
        status: pending
        evidence: ""
      - text: "Content substitution: Every string and image is Novizio product-grid content and brand; the comparison table carries Novizio products and prices. (falsifier: Any detroit.paris copy, media, or placeholder Latin ships in the built product.)"
        status: pending
