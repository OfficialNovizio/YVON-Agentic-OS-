source_message: "create a website for me and this is reference https://www.detroit.paris/

IDENTICAL CLONE — operator-ordered revision (supersedes the ADAPT direction of TS-055, revoked 2026-09-08).
Replicate detroit.paris structure, layout, sections and motion EXACTLY, per the measured design.md (store/design-sessions/945dff05-bb4b-4910-90d8-e283f0c6f2c7-design.md): colors #000000/#ffffff/#ff4c24/#e3e1de/#e2e2e2, display Mangogrotesque ~14.4rem/0.8 with h1 6.75rem/0.85, body Barlow 1rem/1.5 (substitute closest freely-licensed faces only if unavailable, and declare the substitution).
Replace all text and imagery with Novizio product-grid content and brand — zero reference copy or media ships.
Motion stays PURE CODE (CSS + GSAP + Motion, $0): typography-led reveals, directional movement, no bounce.
Build in the repo checkout at workspaces/novizio/; end with a per-criterion status report and real-browser evidence (1440 + 390 screenshots, clean console)."
