        status: pending
        evidence: ""
      - text: "Responsive + reduced motion: At desktop, tablet, and mobile widths the clone remains usable with no horizontal overflow or clipped controls, and with `prefers-reduced-motion: reduce` the motion reduces to immediate/brief states while all content stays available. (falsifier: Any supported width produces overflow or clipping, or full motion plays under the reduced-motion preference.)"
        status: pending
