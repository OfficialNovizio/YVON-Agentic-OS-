Implement the approved ADAPT motion direction for Novizio using CSS, GSAP, and Motion: editorial load choreography, scroll reveals, navigation states, comparison-table interactions, route transitions, responsive behavior, and reduced-motion support. Use abstract or neutral placeholders only; photorealistic content remains out of scope."
