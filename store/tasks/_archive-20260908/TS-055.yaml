work_items:
  - id: WI-1
    owner: "mia"
    objective: "Implement and verify a responsive Novizio editorial motion system whose load, scroll, navigation, comparison, and route interactions work with reduced motion and use no photorealistic or borrowed reference content."
    strategy: BALANCE 1.0x   # per-item budget (FAST | BALANCE ×)
    consumes: []
    produces: "workspaces/novizio/"
    owns_paths: []
    skills: []
    scripts: []
    blocked_by: []
    # v3: one entry per acceptance criterion. status ∈ pass|fail|not_run|pending|deferred.
    # Evidence = the run detail ("chromium 1300×1000 · pass") — a criterion and an
    # assertion are the same line. Flat strings ("- \"criterion text\"") still parse as
    # status: pending for legacy records.
    acceptance:
      - text: "Editorial load choreography: On a clean page load, the primary editorial content enters in a deliberate, observable sequence using fade and/or slide motion, and the final state remains fully readable and interactive. (falsifier: Content appears in an unstyled final state with no choreography, remains hidden, or blocks interaction after the animation completes.)"
        status: pending
        evidence: "reverted: verify-commit route smoke, not a real verifier verdict"
      - text: "Scroll reveals: Sections configured for reveal become visible as they enter the viewport, with restrained fade/slide behavior and no persistent motion after settling. (falsifier: A configured section does not reveal, reveals before it enters the viewport, continuously animates after settling, or causes visible layout jumps.)"
        status: pending
        evidence: ""
      - text: "Navigation states: Navigation exposes distinct, observable states for default, hover, focus, active/current-route, and relevant open/closed behavior. (falsifier: Keyboard focus is not visible, the current route cannot be distinguished, or a state change does not appear or resolve correctly.)"
        status: pending
        evidence: ""
      - text: "Comparison-table interactions: The comparison table presents the approved editorial/pricing-comparison structure and provides a clear response to its supported pointer and keyboard interactions without obscuring required comparison information. (falsifier: A supported interaction produces no state change, cannot be operated by keyboard, or hides essential comparison content without a recoverable state.)"
        status: pending
        evidence: ""
      - text: "Route transitions: Navigating between the supported routes produces a finite transition and leaves the destination route fully loaded, addressable, and interactive. (falsifier: Navigation flashes indefinitely, leaves the previous route visible as the active page, traps focus, or results in an unusable destination.)"
        status: pending
        evidence: ""
      - text: "Responsive behavior: At desktop, tablet, and mobile viewport widths, layout and motion remain usable; no horizontal overflow, clipped controls, or overlapping animated content is present. (falsifier: Any supported viewport produces clipped content, inaccessible controls, horizontal overflow caused by the implementation, or overlapping sections that prevent comprehension.)"
        status: pending
        evidence: ""
      - text: "Reduced motion: With `prefers-reduced-motion: reduce` enabled, nonessential entrance, scroll, and route animations are disabled or reduced to an immediate/brief state while content, navigation, and comparison interactions remain available. (falsifier: Full motion continues under the preference, content remains hidden waiting for animation, or an interaction becomes unavailable.)"
        status: pending
        evidence: ""
      - text: "Content and asset boundary: All displayed copy is Novizio-specific, and visual content uses only abstract or neutral placeholders; no reference copy, reference media, or photorealistic content appears. (falsifier: Any reference-site copy/media or photorealistic asset is shipped in the implemented experience.)"
        status: pending
        evidence: ""
      - text: "Verification gate: In a real browser, CSS keyframe and ScrollTrigger behavior render as intended, the browser console is clean of implementation errors, and the design-flow end-to-end check passes. (falsifier: Motion does not render, console errors occur during the tested flow, or the reduced-motion and design-flow checks fail.)"
        status: pending
        evidence: ""
    security_review: none
