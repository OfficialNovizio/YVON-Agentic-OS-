    - "Use one hero plus one supporting content section"
    - "Use subtle code-based motion instead of video"
    - "Use Novizio-owned content, branding, and assets"

work_items:
  - id: WI-1
    owner: "mia"
    objective: "Implement a responsive two-section Novizio landing page that passes the defined visual, motion, accessibility, and browser verification criteria."
    strategy: BALANCE 1.0x   # per-item budget (FAST | BALANCE ×)
    consumes: []
    produces: "workspaces/novizio/"
    owns_paths: []
    skills: []
    scripts: []
    blocked_by: []
    # v3: one entry per acceptance criterion. status ∈ pass|fail|not_run|pending|deferred.
    # Evidence = the run detail ("chromium 1300×1000 · pass") — a criterion and an
    # assertion are the same line. Flat strings ("- \"criterion text\"") still parse as
    # status: pending for legacy records.
    # Filled 2026-09-06 from TS-054-prd.md §6 (the convert chain left the
    # template stub — the alignment verifier judged against the PRD's list,
    # so the record must carry the same criteria it is scored on).
    acceptance:
      - text: "Two-section structure: a stranger can load the landing page and identify exactly one primary hero section followed by exactly one supporting content section (no extra content section, none omitted, order not reversed)."
        status: pass
        evidence: "Live browser inspection found exactly two main section elements: the hero first and #manifesto supporting content second. The rendered page showed no additional content section."
      - text: "Novizio adaptation: the page visibly uses Novizio-owned branding, fresh venture copy, and venture-owned or generated imagery rather than reference content or media."
        status: pass
        evidence: "The rendered page visibly uses the NOVIZIO wordmark, Novizio-specific copy such as 'A new domestic language' and 'The Novizio manifesto / 2026', and a CSS-generated hero field. Browser inspection found zero img elements and no reference media."
      - text: "Navigation: the page presents a shorter navigation consistent with the adapted brief and remains usable at supported responsive widths."
        status: pass
        evidence: "The live page presents the shortened Manifesto / The atelier navigation plus a MENU control. The mobile menu exposes the same links and uses aria-expanded, aria-controls, and aria-hidden state."
      - text: "Responsive behavior: hero, navigation, imagery, typography, and supporting content remain readable and structurally coherent on desktop and mobile viewport sizes."
        status: pass
        evidence: "Desktop browser inspection rendered a 1280px viewport without horizontal overflow; preserved mobile evidence is 375px wide with scrollWidth equal to clientWidth, and the mobile screenshot shows the hero and supporting content remain readable."
      - text: "Motion technique: the page uses code-based motion only, with subtle reveal, transition, or scroll behavior that renders in a real browser."
        status: pass
        evidence: "Live browser inspection observed three active CSS animations on the hero orb and scroll cue, and the source uses GSAP entrance and ScrollTrigger parallax effects. The production build completed successfully."
      - text: "Reduced motion: when prefers-reduced-motion: reduce is enabled, nonessential animation and scroll effects are removed or substantially reduced while all content remains available."
        status: pass
        evidence: "The source includes prefers-reduced-motion handling that disables smooth scrolling, shortens CSS animation and transition durations, and skips GSAP effects. Preserved reduced-motion verification reports no animations, visible hero opacity 1, transform none, and zero console errors."
      - text: "Runtime quality: the landing page loads successfully, the browser console is clean during the verification flow, and the design-flow end-to-end check completes."
        status: pass
        evidence: "npm run lint and npm run build passed; the production page returned successfully and rendered the expected Novizio page; browser_console reported zero console messages and zero JavaScript errors; preserved live verification reports fail=0."
      - text: "Asset integrity: no asset swap is required for the implemented page, consistent with the finalized recipe's zero-swap asset plan."
        status: pass
        evidence: "The implemented page has zero img elements and uses CSS-generated hero imagery, so no asset swap is required under the finalized zero-swap asset plan."
    security_review: none
    # v3 roles: doer (writes), verifier (owns the suite — assertions ≠ author),
