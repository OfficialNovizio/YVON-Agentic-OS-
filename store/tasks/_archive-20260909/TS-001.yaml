# TASK-SPEC template v3 (2026-08-24) — generated by meta/task-dispatch. Do not fill by hand
# without meta's protocol: discovery once → DAG → sign-off → activate.
#
# v3 adds (from the "One Request, End to End" artifact, beats 9–22):
#   · review state            — gated → review → done; the suite decides (task.sh review / suite)
#   · blocked SIDECAR         — blocked: true keeps the status field unchanged; a task can be
#                               blocked AND executing (task.sh block / unblock)
#   · acceptance statuses     — per-criterion pass/fail/not_run/pending/deferred + evidence
#                               (task.sh set-acceptance); flat-string criteria still parse (legacy)
#   · doer/verifier/integrator— per work item (task.sh set-roles)
#   · handoff packet          — entry/contract/stubbed/needs_wiring/tokens/verified_on
#                               (task.sh set-handoff → event handoff_emitted)
#   · derived_from            — distinct from revision_of: same goal (revision) vs different
#                               goal made possible by the first (derived). new --derived-from
#   · superseded_by           — auto-marked on `new --revision-of` (rotation is forward-only)
#   · run_ref                 — the run record replaces prose exit proof (task.sh suite --run)
#   · updated_at              — stamped on every transition/activity (staleness)
id: TS-001
status: review            # draft → discovery → approved → executing → gated → review → done
source_message: "Build Novizio reference-led marketing site

Implement the Novizio website as an identical structural clone of the approved Detroit Paris reference, replacing all reference copy and media with Novizio-owned content while reproducing the measured layout and motion through CSS, GSAP, and Motion. Use the completed design.md as the source of truth, then run production, accessibility, responsive, and rendered browser verification."
requester: operator
