work_items:
  - id: WI-1
    owner: "mia"
    objective: "Ship a production-ready Novizio marketing site that matches the approved reference structure and measured design while using only Novizio-owned content and passing all defined verification gates."
    strategy: BALANCE 1.0x   # per-item budget (FAST | BALANCE ×)
    consumes: []
    produces: "workspaces/novizio/"
    owns_paths: []
    skills: []
    scripts: []
    blocked_by: []
    # v3: one entry per acceptance criterion. status ∈ pass|fail|not_run|pending|deferred.
    # Evidence = the run detail ("chromium 1300×1000 · pass") — a criterion and an
    # assertion are the same line. Flat strings ("- \"criterion text\"") still parse as
    # status: pending for legacy records.
    acceptance:
      - text: "Reference structure: A stranger comparing the deployed site with the approved reference capture can identify the same page sections, ordering, primary navigation pattern, and major layout relationships. **Falsifies if:** any major reference section is missing, reordered, or replaced with a materially different page structure."
        status: pass
        evidence: "Real-browser accessibility snapshot: hero statement MAKE ROOM., manifesto/atelier, asymmetric collections grid, comparison section in reference order; nav NOVIZIO / MANIFESTO / COLLECTIONS / CATALOG + fullscreen menu overlay."
      - text: "Reference styling: The implementation follows the typography, color, spacing, radius, breakpoint, and elevation values recorded in `design.md` wherever those values are specified. **Falsifies if:** a specified value is replaced by an unrelated style without a documented limitation or the page visibly departs from the measured design system."
        status: pass
        evidence: "Computed styles measured in Chromium 1440: display 230px (=14.375rem) weight 700 condensed uppercase, palette #ffffff/#000000 with accent rgb(255,76,36), surfaces #e3e1de/#e2e2e2; zero non-circular border-radius on layout containers; breakpoints 991/768/767/479 present."
      - text: "Owned content and media: No visible copy, image, video, logo, or other media is sourced from Detroit Paris; all visible content is Novizio-owned or appropriately licensed/generated. **Falsifies if:** a reference brand name, reference copy, hotlinked reference asset, or unapproved reference media appears in the built site."
        status: pass
        evidence: "Independent repository + rendered-DOM scan: zero matches for reference brand, reference copy, or hotlinked reference assets; all artwork CSS-generated surfaces."
      - text: "Motion implementation: The production site visibly renders the approved code-based motion, including the applicable CSS animation/transitions and GSAP/ScrollTrigger behavior, rather than relying on reference videos as substitutes. **Falsifies if:** a required motion effect does not render in a real browser, is implemented only as a static frame, or depends on borrowed reference media."
        status: pass
        evidence: "Runtime computed styles show live GSAP/ScrollTrigger choreography plus breathe/pulse/orbit-breathe keyframes with active transforms; sections reveal on scroll (0 hidden children after scroll pass)."
      - text: "Reduced motion: With `prefers-reduced-motion: reduce` enabled, nonessential movement is suppressed or materially reduced while content and essential interactions remain usable. **Falsifies if:** substantial decorative motion continues unchanged or content becomes inaccessible under reduced-motion settings."
        status: pass
        evidence: "prefers-reduced-motion: reduce emulation: 0 infinite animation loops (3 in normal mode), durations clamped, content fully visible."
      - text: "Responsive behavior: At each recorded breakpoint boundary—991px, 768px, 767px, and 479px—the site remains usable and the layout adapts without horizontal overflow or clipped primary content. **Falsifies if:** any tested viewport produces horizontal scrolling, overlapping content, unreachable controls, or clipped essential text/media."
        status: pass
        evidence: "991/768/767/479 boundaries tested in a real browser: all four sections present, no horizontal overflow at any boundary; 390px viewport: no overflow, display scales to 85.8px."
      - text: "Accessibility: A real-browser accessibility check finds no blocking keyboard-navigation, focus-visibility, semantic-labeling, contrast, or image-alternative failure in the implemented experience. **Falsifies if:** a stranger cannot reach an interactive element by keyboard, cannot identify its purpose, encounters an invisible focus state, or finds an unhandled meaningful image."
        status: pass
        evidence: "axe-core WCAG 2.0/2.1 A+AA audit on the rendered page: 0 violations, 23 rule sets passed, 1 incomplete (manual review). Semantic headings, navigation, labelled regions, focusable controls confirmed."
      - text: "Production integrity: The application completes a production build and loads the primary marketing route in a production-like environment without runtime errors. **Falsifies if:** the production build fails, the route cannot load, or a runtime exception prevents primary content from rendering."
        status: pass
        evidence: "npm run build passed (Next.js 16.1.6, prerendered routes); preview serves HTTP 200 at novizio.preview.yvon.in with clean console (no errors)."
      - text: "Browser verification: Quinn’s real-browser gate confirms the page renders, the console is clean, motion works, reduced motion is respected, and the design-flow end-to-end test passes. **Falsifies if:** console errors, failed network/runtime behavior, missing motion, reduced-motion failure, or a design-flow test failure remains unresolved."
        status: pass
        evidence: "Independent Playwright real-browser gate on the live preview URL: page render, console (0 errors), motion, reduced-motion, responsive 1440/390, section reveals all verified; evidence screenshots captured."
    security_review: none
    # v3 roles: doer (writes), verifier (owns the suite — assertions ≠ author),
