id: TS-035
status: executing        # implementation written + py_compile-clean; tsc/commit/push/VPS-deploy/live-test still pending the operator
source_message: "I want to add a new feature whenever you work on anything new I want you to give me 2 new url to view one for repo files and one for the localhost type of that project"
requester: Stark
rules:
  sharding: worker receives ONLY its work item + consumed contracts
  handoff: contracts-only — no transcript inheritance
  inject_form: .toon (this YAML is the source form)

classification:
  task_type: "new feature — repo file browser + live dev-server preview links, surfaced in /chat"
  departments: []
  lead: ""

context:
  chunks: []
  existing_assets:
    - "vps-scripts/yvon-hermes-http/main.py — _ensure_repo_clone / REPO_WORKSPACES_DIR (TS-035 built on top of the 2026-08-21 single-system repo rework)"
    - "dashboard/app/api/chat/stream/route.ts — chat_stream SSE handling"
    - "dashboard/lib/hermes-client.ts — streamHermesChat/HermesEvent"
  conflicts: []

discovery:                # captured via 3 rounds of operator Q&A in-session, not task.sh's discovery step
  questions:
    - "Repo-files link: redirect to GitHub, or a real in-app browser over the live VPS checkout (may include uncommitted work)?"
    - "Preview link: a genuinely running dev server, or hold off as a separate follow-up?"
    - "Trigger: every turn that touches the repo, or gated somehow?"
    - "Preview routing: path-based (hermes.yvon.in/preview/<slug>/, ships immediately but breaks CSS/JS/HMR for most real dev servers) vs subdomain-per-venture (<slug>.preview.yvon.in, correct/robust but needs a wildcard DNS record + nginx + TLS cert from the operator)?"
  decisions:
    - "Repo files = real in-app browser reading the actual persistent per-venture checkout (REPO_WORKSPACES_DIR), not a GitHub redirect — operator answered 'whole repo'."
    - "Preview = an actually-running dev server, not deferred."
    - "Trigger = once per chat room, only on a turn that really changed the repo — operator: 'when chat initiated and some work is done in code and only provide once in chat not every work.' Implemented via a server-side git-state fingerprint (HEAD + dirty-tree) diffed before/after the turn in main.py — never a self-reported model marker — plus a new chat_rooms.repo_links_shown_at column gating it to once per room."
    - "Preview routing = subdomain-per-venture (operator picked 'Subdomain per venture (Recommended)'). Needs one one-time operator step outside this codebase: wildcard DNS (*.preview.yvon.in → VPS IP) + nginx server block + wildcard TLS cert — not yet done as of this task's authoring."

work_items:
  - id: WI-1
    owner: Claude (Cowork session)
    objective: "VPS (main.py): read-only file-tree/file-content endpoints over a venture's live checkout, plus dev-server lifecycle (port allocation, start-command detection, process tracking) and an nginx preview-port-map writer."
    strategy: BALANCE 1.0x
    consumes: ["_ensure_repo_clone", "REPO_WORKSPACES_DIR"]
    produces: "GET /v1/repo/tree, GET /v1/repo/file, POST /v1/repo/preview endpoints + _ensure_dev_server/_detect_start_command/_allocate_port/_write_preview_port_map/_repo_fingerprint helpers"
    owns_paths: ["vps-scripts/yvon-hermes-http/main.py"]
    skills: []
    scripts: []
    blocked_by: []
    acceptance:
      - "python3 -m py_compile main.py clean"
      - "/v1/repo/tree and /v1/repo/file are sandboxed to the venture's workdir (realpath check, no path traversal)"
      - "/v1/repo/preview starts a dev server only for recognized project types (package.json dev/start script, or manage.py) and reports a clear error otherwise"
    security_review: "auth: all 3 endpoints gated behind the existing require_bearer dependency, same as every other /v1 route. Path traversal explicitly rejected in _read_repo_file. NOT yet reviewed: whether the live preview subdomain (once nginx/DNS is set up) needs its own access control beyond obscurity of the venture slug — flagged, not resolved."

  - id: WI-2
    owner: Claude (Cowork session)
    objective: "Dashboard: detect repoChanged on the 'done' SSE event, gate to once-per-room via a new chat_rooms column, call /v1/repo/preview, and append the two links to that turn's reply — live in the same turn, not just on reload."
    strategy: BALANCE 1.0x
    consumes: ["WI-1's /v1/repo/preview"]
    produces: "hermes-client.ts (repoChanged type + ensureRepoPreview), stream/route.ts (gating + link injection), Supabase migration chat_rooms_repo_links_shown_at"
    owns_paths: ["dashboard/lib/hermes-client.ts", "dashboard/app/api/chat/stream/route.ts"]
    skills: []
    scripts: []
    blocked_by: ["WI-1"]
    acceptance:
      - "migration applied live via Supabase MCP (chat_rooms.repo_links_shown_at) — done 2026-08-21"
      - "links appended to the SAME turn's streamed response, not just the saved DB row"
      - "best-effort: a failure in the link-injection try/catch never breaks the underlying chat turn"
    security_review: none

  - id: WI-3
    owner: Claude (Cowork session)
    objective: "Dashboard: read-only file browser page for a venture's live checkout, proxied through authenticated dashboard API routes (bearer token never reaches the browser)."
    strategy: BALANCE 1.0x
    consumes: ["WI-1's /v1/repo/tree, /v1/repo/file"]
    produces: "/repo/[slug] page + RepoBrowserClient.tsx + /api/repo/tree, /api/repo/file route handlers"
    owns_paths: ["dashboard/app/repo/[slug]/", "dashboard/app/api/repo/"]
    skills: []
    scripts: []
    blocked_by: ["WI-1"]
    acceptance:
      - "GET routes require an authenticated Supabase user (supabase.auth.getUser()), same as stream/route.ts"
      - "page renders a filterable file list + content viewer with no new heavy dependency"
    security_review: none

  - id: WI-4
    owner: Stark (operator)
    objective: "One-time infra: wildcard DNS record for *.preview.yvon.in → VPS IP, matching nginx server block reading the port map WI-1 writes, and a wildcard TLS cert (DNS-01 challenge — depends on DNS provider, not yet identified)."
    strategy: BALANCE 1.0x
    consumes: []
    produces: "live *.preview.yvon.in routing"
    owns_paths: []
    skills: []
    scripts: []
    blocked_by: ["WI-1"]
    acceptance:
      - "https://<any-venture-slug>.preview.yvon.in/ resolves and TLS validates"
    security_review: none

dag:
  parallel: [WI-1]
  critical_path: [WI-1, WI-2, WI-3, WI-4]

exit_gate:
  owner: Stark
  proof: "operator confirms: tsc --noEmit clean, git pushed, VPS main.py redeployed + restarted, a real chat turn that edits a file shows both links, and (once WI-4 is done) the preview link actually loads the running project"

