# TASK-SPEC template v3 (2026-08-24) — generated by meta/task-dispatch. Do not fill by hand
# without meta's protocol: discovery once → DAG → sign-off → activate.
#
# v3 adds (from the "One Request, End to End" artifact, beats 9–22):
#   · review state            — gated → review → done; the suite decides (task.sh review / suite)
#   · blocked SIDECAR         — blocked: true keeps the status field unchanged; a task can be
#                               blocked AND executing (task.sh block / unblock)
#   · acceptance statuses     — per-criterion pass/fail/not_run/pending/deferred + evidence
#                               (task.sh set-acceptance); flat-string criteria still parse (legacy)
#   · doer/verifier/integrator— per work item (task.sh set-roles)
#   · handoff packet          — entry/contract/stubbed/needs_wiring/tokens/verified_on
#                               (task.sh set-handoff → event handoff_emitted)
#   · derived_from            — distinct from revision_of: same goal (revision) vs different
#                               goal made possible by the first (derived). new --derived-from
#   · superseded_by           — auto-marked on `new --revision-of` (rotation is forward-only)
#   · run_ref                 — the run record replaces prose exit proof (task.sh suite --run)
#   · updated_at              — stamped on every transition/activity (staleness)
id: TS-000
status: draft            # draft → discovery → approved → executing → gated → review → done
source_message: ""       # verbatim, never paraphrased
requester: operator
rules:
  sharding: worker receives ONLY its work item + consumed contracts
  handoff: contracts-only — no transcript inheritance
  inject_form: .toon (this YAML is the source form)

classification:
  task_type: ""
  departments: []
  lead: ""
  # gate_0: true              # uncomment if this touches frontend/backend/API/security/algorithm structure (MASTER Sec7.0) — requires gate_0_signoffs before approve
  # gate_0_signoffs: []       #   who signed the RFC (dev/spec/meta/warden, or [operator] if operator-ordered)

context:                 # hook-injected, gate-verified (citations only)
  chunks: []
  existing_assets: []
  conflicts: []

discovery:               # BLOCKING — no fan-out until resolved
  questions: []
  decisions: []

work_items:
  - id: WI-1
    owner: ""
    objective: ""        # one testable sentence
    strategy: BALANCE 1.0x   # per-item budget (FAST | BALANCE ×)
    consumes: []
    produces: ""
    owns_paths: []
    skills: []
    scripts: []
    blocked_by: []
    # v3: one entry per acceptance criterion. status ∈ pass|fail|not_run|pending|deferred.
    # Evidence = the run detail ("chromium 1300×1000 · pass") — a criterion and an
    # assertion are the same line. Flat strings ("- \"criterion text\"") still parse as
    # status: pending for legacy records.
    acceptance:
      - text: ""
        status: pending
        evidence: ""
    security_review: none
    # v3 roles: doer (writes), verifier (owns the suite — assertions ≠ author),
    # integrator (takes the brief at handoff). Defaults to owner when unset.
    doer: ""
    verifier: ""
    integrator: ""

dag:
  parallel: []
  critical_path: []

exit_gate:
  owner: ""
  proof: ""

feedback:                # filled post-execution — anneal consumes
  outcome: null          # accepted | revised | rejected
  lesson: null

created_at: ""            # ISO timestamp, set by task.sh new
updated_at: ""            # ISO timestamp, stamped on every transition/activity (v3 — staleness)
revision_of: null         # set at creation if this is a retry/redo of another task (task.sh new --revision-of <TS-id>)
derived_from: null        # v3 — set if this task was made possible by another (task.sh new --derived-from <TS-id>)
superseded_by: null       # v3 — set automatically when a revision of this task is created (forward-only rotation)
blocked: false            # v3 SIDECAR — true while blocked; status field is UNCHANGED (task.sh block/unblock)
blocked_at: ""            # v3
blocked_reason: ""        # v3 — never empty while blocked: true
run_ref: ""               # v3 — the run record that closed review/done (task.sh suite --run <path>)
history: []                # sourceful trail — task.sh appends one {ts,actor,event,note} entry per transition + task.sh note

# Handoff packet (v3, task.sh set-handoff) — written while the context is still live.
# Six fields: entry / contract / stubbed / needs_wiring / tokens / verified_on.
handoff: {}

# PRD gate (2026-08-18, docs/PRD-prd-gated-task-conversion.md) — BLOCKING on
# discovery -> approved (task.sh approve refuses without both). Set together
# via `task.sh set-prd <id> --ref <path> --rice <score>`, never hand-typed.
prd_ref: ""               # path to store/tasks/{id}-prd.md — spec's generated PRD (prd-discipline: 7 sections + Working Agents + Context Refs)
rice_score: ""            # spec's scripts/rice.py output for this item — "[reasoning-based, not formula-verified]" per backlog-rules rule 0.6

# Design-origin linkage (2026-08-19, docs/PRD-design-first-workflow.md) —
# optional, only set on tasks that came out of cli/design.py's handoff, via
# `task.sh set-design-origin <id> --session <sid> --tool screenshot-to-code|open-design|custom
#   [--artifact <artifact_id>] [--handoff <path>]`. Never hand-typed. Powers
# the dashboard's unified design-preview panel (TaskFocusView) — absent on
# every task not sourced this way, never guessed.
design_session_id: ""      # store/design-sessions/{id}.json
design_tool: ""            # screenshot-to-code | open-design | custom
design_artifact_id: ""     # open-design live-artifact id, when one exists
design_handoff_path: ""    # store/design-sessions/{id}-handoff.md
