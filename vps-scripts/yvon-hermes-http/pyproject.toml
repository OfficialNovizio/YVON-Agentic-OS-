[project]
name = "yvon-hermes-http"
version = "0.1.0"
description = "FastAPI wrapper exposing Hermes AIAgent as an SSE HTTP endpoint for the YVON dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["main"]
