# /etc/nginx/sites-available/hermes.yvon.in
# Reverse-proxies https://hermes.yvon.in → yvon-hermes-http on 127.0.0.1:8765.
# SSE-friendly: proxy_buffering off + long read timeouts.
#
# Installed by install.sh; certbot handles TLS certificate issuance/renewal.

# HTTP → HTTPS redirect. Certbot's --nginx plugin also writes this block,
# but we include it explicitly so the config is self-contained.
server {
    listen 80;
    listen [::]:80;
    server_name hermes.yvon.in;

    # ACME challenges (certbot renewal) served from the default webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hermes.yvon.in;

    # TLS — certbot fills these in on first run.
    # ssl_certificate     /etc/letsencrypt/live/hermes.yvon.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hermes.yvon.in/privkey.pem;

    # Modern TLS settings (matches Mozilla "intermediate")
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Reasonable body cap — chat messages are small.
    client_max_body_size 1m;

    # Access log with request time (useful for spotting slow streams)
    access_log /var/log/nginx/hermes.access.log combined;
    error_log  /var/log/nginx/hermes.error.log warn;

    # Reverse-proxy to yvon-hermes-http
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ─── SSE-specific tuning ────────────────────────────────────────
        # 1. Disable ALL buffering so tokens stream through immediately.
        proxy_buffering off;
        proxy_cache off;

        # 2. HTTP/1.1 without Connection: close (matches proxy_http_version above)
        proxy_set_header Connection '';

        # 3. Long timeouts — agent chats can run 60+ seconds
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 4. Disable request buffering too (POST body arrives quickly for chat)
        proxy_request_buffering off;
    }
}
