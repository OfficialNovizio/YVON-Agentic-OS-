# Compliance obligation register — comply/custom/obligation-register
# Managed by comply's obligation-register skill. Do not edit rows manually —
# use the skill's Register / Update / Attest / Retire protocol so provenance
# and audit history stay consistent (playbook §5, §0.5, §0.7).
#
# Schema per obligation entry:
#   slug: <kebab-case, unique for (venture_scope, regime, jurisdiction) tuple>
#   revision: <int, starts at 1>
#   status: <draft | active | archived | retired>
#   regime: <e.g., GDPR | SOX | HIPAA | ISO-27001 | venture-specific licence>
#   jurisdiction: <e.g., EU | US-federal | US-CA | CA-federal | UK>
#   venture_scope: <one or more ventures, or 'org-wide'>
#   obligation_type: <reporting | attestation | retention | breach-notification | disclosure | registration | audit | training | other>
#   description: <plain-language paragraph>
#   cadence: <one-time | annual | quarterly | on-trigger | continuous>
#   next_due_date: YYYY-MM-DD | null
#   owner: <name, role, or handoff-agent slug>
#   source_citation: <regulator + article/section, e.g., "GDPR Art. 30", "SOX §404(b)">
#   source_url: <link to primary source>
#   source_tag: <one of [regulator], [secondary source], [user provided], [web search — verify], [model knowledge — verify]>
#   last_attested: YYYY-MM-DD | null
#   last_attested_by: <name or role>
#   evidence: <link to audit trail, control test, filing receipt, contract clause>
#   remediation: <null, or {owner, due_date, note} if partial-attestation>
#   superseded_by: <revision number of successor row | null>
#   retired_date: YYYY-MM-DD | null
#   retired_reason: <string | null>
#   registered_at: YYYY-MM-DD
#   registered_by: <name>

obligations: []
